# Les adresses que le jeu montre.
#
# Une par ligne, « clé = adresse ». Les lignes vides et celles qui commencent
# par un dièse sont passées.
#
# Lues par CMake à la configuration et posées dans un en-tête -- voir
# CMakeLists.txt et src/Links.h.in. Changer une adresse ici suffit donc, mais
# il faut reconfigurer: ce fichier n'accompagne pas le programme, il est
# compilé dedans comme l'est le numéro de version.
#
# Une clé demandée par CMake et absente d'ici arrête la configuration. C'est
# voulu: un lien qui disparaît sans un mot de la boîte de réglages ne se
# remarque pas avant longtemps.

# L'éditeur avec lequel on fabrique un jeu de cartes, montré sur les pages
# « Les cartes » et « Les dos » des réglages.
editeur-de-cartes = https://github.com/pdulvp/pdcartes-barquette
